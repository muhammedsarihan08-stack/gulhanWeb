<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Gülhan Polat | Key Account Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e2e8f0;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
      padding: 16px;
      color: #0f172a;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 24px 48px -12px rgba(15, 23, 42, 0.18), 0 0 0 1px rgba(15, 23, 42, 0.06);
    }

    /* Üst Kurumsal Kapak Alanı */
    .card-header {
      height: 138px;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #2563eb 100%);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 20px;
    }

    /* Sağ Üst Dil Değiştirici (TR / EN) */
    .lang-switch {
      position: absolute;
      top: 14px;
      right: 14px;
      display: inline-flex;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      padding: 3px;
      z-index: 5;
    }

    .lang-btn {
      border: none;
      background: transparent;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .lang-btn.active {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* Şeffaf PNG Logo için Temiz Cam Kapsül */
    .logo-pill {
      background: rgba(255, 255, 255, 0.95);
      padding: 7px 18px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .company-logo {
      height: 26px;
      width: auto;
      display: block;
      object-fit: contain;
    }

    /* Kapağın Üzerine Oturan Profil Fotoğrafı */
    .avatar-wrapper {
      width: 118px;
      height: 118px;
      margin: -59px auto 14px;
      position: relative;
      z-index: 2;
      border-radius: 50%;
      padding: 4px;
      background: #ffffff;
      box-shadow: 0 12px 28px rgba(15, 23, 42, 0.16);
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
      background: #f1f5f9;
    }

    .card-body {
      padding: 0 22px 24px;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.025em;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .role {
      font-size: 0.92rem;
      font-weight: 600;
      color: #2563eb;
      margin-bottom: 2px;
    }

    .company-sub {
      font-size: 0.8rem;
      font-weight: 500;
      color: #64748b;
      margin-bottom: 20px;
    }

    /* İletişim Kartları */
    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 18px;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      text-align: left;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .contact-item:hover {
      background: #f1f5f9;
      border-color: #cbd5e1;
      transform: translateY(-1px);
    }

    .contact-item:active {
      transform: scale(0.98);
    }

    .contact-left {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      min-width: 40px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-phone { background: #dcfce7; color: #16a34a; }
    .icon-mail  { background: #e0f2fe; color: #0284c7; }
    .icon-li    { background: #dbeafe; color: #0a66c2; }

    .contact-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .contact-label {
      font-size: 0.72rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .contact-value {
      font-size: 0.92rem;
      font-weight: 600;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .arrow-badge {
      color: #94a3b8;
      display: flex;
      align-items: center;
      padding-left: 8px;
    }

    /* Alt İkili Aksiyon Butonları */
    .cta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 12px;
      border-radius: 15px;
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-wa {
      background: #16a34a;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(22, 163, 74, 0.25);
    }

    .btn-save {
      background: #0f172a;
      color: #ffffff;
      box-shadow: 0 8px 18px rgba(15, 23, 42, 0.18);
    }
  </style>
</head>
<body>

  <main class="card">
    <!-- Üst Kurumsal Kapak & Şeffaf PNG Logo -->
    <div class="card-header">
      <div class="lang-switch" role="group" aria-label="Language Switcher">
        <button type="button" class="lang-btn active" id="btn-tr" onclick="setLanguage('tr')">TR</button>
        <button type="button" class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
      </div>

      <div class="logo-pill" id="logoContainer">
        <img
          src="logo.png"
          alt="Alcam"
          class="company-logo"
          onerror="document.getElementById('logoContainer').style.display='none'"
        />
      </div>
    </div>

    <!-- Profil Fotoğrafı -->
    <div class="avatar-wrapper">
      <img
        src="gulhan.jpg"
        alt="Gülhan Polat"
        class="avatar"
        onerror="this.src='https://ui-avatars.com/api/?name=G%C3%BClhan+Polat&background=1e3a8a&color=fff&size=256&bold=true'"
      />
    </div>

    <div class="card-body">
      <h1>Gülhan Polat</h1>
      <div class="role">Key Account Manager</div>
      <div class="company-sub">Alcam</div>

      <div class="contact-list">
        <!-- Telefon -->
        <a href="tel:+905499801492" class="contact-item">
          <div class="contact-left">
            <div class="icon-box icon-phone">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label" id="lbl-phone">Telefon</span>
              <span class="contact-value">+90 549 980 14 92</span>
            </div>
          </div>
          <span class="arrow-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </a>

        <!-- E-Posta -->
        <a id="link-mail" href="mailto:gulhan@alcam.com.tr?subject=Fuar%20G%C3%B6r%C3%BC%C5%9Fmesi%20Hakk%C4%B1nda" class="contact-item">
          <div class="contact-left">
            <div class="icon-box icon-mail">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="20" height="16" x="2" y="4" rx="2"/>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label" id="lbl-email">E-Posta</span>
              <span class="contact-value">gulhan@alcam.com.tr</span>
            </div>
          </div>
          <span class="arrow-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </span>
        </a>

        <!-- LinkedIn -->
        <a href="https://www.linkedin.com/in/g%C3%BClhan-polat-a1844320a" target="_blank" rel="noopener" class="contact-item">
          <div class="contact-left">
            <div class="icon-box icon-li">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
              </svg>
            </div>
            <div class="contact-info">
              <span class="contact-label">LinkedIn</span>
              <span class="contact-value" id="val-linkedin">Profili Görüntüle</span>
            </div>
          </div>
          <span class="arrow-badge">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg>
          </span>
        </a>
      </div>

      <!-- Alt İkili Butonlar: WhatsApp + Rehbere Kaydet -->
      <div class="cta-grid">
        <a
          id="link-wa"
          href="https://wa.me/905499801492?text=Merhaba%20G%C3%BClhan%20Han%C4%B1m%2C%20fuarda%20tan%C4%B1%C5%9Fm%C4%B1%C5%9Ft%C4%B1k.%20Dijital%20kartvizitiniz%20%C3%BCzerinden%20ula%C5%9F%C4%B1yorum."
          target="_blank"
          rel="noopener"
          class="btn btn-wa"
        >
          <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12.031 2c-5.516 0-9.969 4.453-9.969 9.969 0 1.758.459 3.475 1.331 4.988L2 22l5.182-1.359a9.93 9.93 0 0 0 4.849 1.26h.004c5.515 0 9.969-4.454 9.969-9.969A9.927 9.927 0 0 0 19.08 4.92 9.914 9.914 0 0 0 12.031 2zm5.815 14.274c-.245.691-1.426 1.321-1.976 1.404-.506.076-1.147.108-1.851-.116-.427-.136-.976-.317-1.678-.62-2.952-1.274-4.88-4.246-5.027-4.443-.148-.197-1.2-1.596-1.2-3.045 0-1.448.758-2.16 1.028-2.455.27-.295.59-.369.786-.369.197 0 .393.002.565.01.181.009.424-.069.663.506.245.591.835 2.038.909 2.186.074.148.123.32.025.516-.098.197-.148.32-.295.492-.148.172-.31.384-.443.516-.148.147-.302.307-.13.602.172.295.764 1.26 1.64 2.041 1.127 1.005 2.077 1.316 2.372 1.464.295.147.467.123.639-.074.172-.197.738-.861.934-1.156.197-.295.393-.246.663-.148.271.099 1.721.812 2.016.959.295.148.492.222.565.345.074.123.074.713-.171 1.404z"/>
          </svg>
          WhatsApp
        </a>

        <button type="button" class="btn btn-save" onclick="downloadVCard()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <line x1="19" y1="8" x2="19" y2="14"/>
            <line x1="22" y1="11" x2="16" y2="11"/>
          </svg>
          <span id="txt-save">Rehbere Kaydet</span>
        </button>
      </div>
    </div>
  </main>

  <script>
    const translations = {
      tr: {
        phoneLabel: "Telefon",
        emailLabel: "E-Posta",
        linkedinVal: "Profili Görüntüle",
        saveBtn: "Rehbere Kaydet",
        mailHref: "mailto:gulhan@alcam.com.tr?subject=Fuar%20G%C3%B6r%C3%BC%C5%9Fmesi%20Hakk%C4%B1nda",
        waHref: "https://wa.me/905499801492?text=Merhaba%20G%C3%BClhan%20Han%C4%B1m%2C%20fuarda%20tan%C4%B1%C5%9Fm%C4%B1%C5%9Ft%C4%B1k.%20Dijital%20kartvizitiniz%20%C3%BCzerinden%20ula%C5%9F%C4%B1yorum."
      },
      en: {
        phoneLabel: "Phone",
        emailLabel: "E-Mail",
        linkedinVal: "View Profile",
        saveBtn: "Save Contact",
        mailHref: "mailto:gulhan@alcam.com.tr?subject=Following%20Up%20from%20the%20Exhibition",
        waHref: "https://wa.me/905499801492?text=Hello%20Ms.%20G%C3%BClhan%2C%20it%20was%20great%20meeting%20you%20at%20the%20exhibition.%20Reaching%20out%20via%20your%20digital%20business%20card."
      }
    };

    function setLanguage(lang) {
      const t = translations[lang] || translations.tr;
      document.documentElement.lang = lang;

      document.getElementById("lbl-phone").textContent = t.phoneLabel;
      document.getElementById("lbl-email").textContent = t.emailLabel;
      document.getElementById("val-linkedin").textContent = t.linkedinVal;
      document.getElementById("txt-save").textContent = t.saveBtn;
      document.getElementById("link-mail").href = t.mailHref;
      document.getElementById("link-wa").href = t.waHref;

      document.getElementById("btn-tr").classList.toggle("active", lang === "tr");
      document.getElementById("btn-en").classList.toggle("active", lang === "en");
    }

    // Ziyaretçinin telefon dili Türkçe değilse otomatik İngilizce başlat
    (function initLanguage() {
      const userLang = (navigator.language || navigator.userLanguage || "tr").toLowerCase();
      if (!userLang.startsWith("tr")) {
        setLanguage("en");
      }
    })();

    function downloadVCard() {
      const vcard = [
        "BEGIN:VCARD",
        "VERSION:3.0",
        "N:Polat;Gülhan;;;",
        "FN:Gülhan Polat",
        "ORG:Alcam",
        "TITLE:Key Account Manager",
        "TEL;TYPE=CELL,VOICE:+905499801492",
        "EMAIL;TYPE=PREF,INTERNET:gulhan@alcam.com.tr",
        "URL:https://www.linkedin.com/in/g%C3%BClhan-polat-a1844320a",
        "END:VCARD"
      ].join("\n");

      const blob = new Blob([vcard], { type: "text/vcard;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "Gulhan_Polat.vcf";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
